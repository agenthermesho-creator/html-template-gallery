<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Template Picker</title>
  <style>
    :root{--bg:#f5f3ef;--surface:#fff;--border:#e2ddd4;--text:#1c1b18;--muted:#8a857a;--accent:#0969da;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px 16px calc(16px + var(--safe-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
    h1{font-size:20px;font-weight:700;margin-bottom:2px}
    .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
    .bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:10}
    .bar button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;min-height:36px;touch-action:manipulation;transition:all.1s}
    .bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .bar .srch{flex:1;min-width:100px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:13px;outline:none;background:var(--surface);min-height:36px}
    .bar .srch:focus{border-color:var(--accent)}
    .bar .cnt{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center;margin-left:4px}

    .l{display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
    .c{background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all.1s}
    .c:active{transform:scale(.98);background:#f8f6f2}
    .c-r1{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
    .c-n{font-size:15px;font-weight:600}
    .c-b{font-size:10px;padding:2px 8px;border-radius:10px;background:#f0eee8;color:var(--muted)}
    .c-t{font-size:12px;color:var(--muted);line-height:1.35;margin-bottom:6px}
    .c-tags{display:flex;gap:4px;flex-wrap:wrap}
    .c-tags span{font-size:10px;padding:2px 8px;border-radius:8px;background:#f0eee8;color:#666}
    .pr{background:#e3f2fd;color:#1565c0}
    .ed{background:#fce4ec;color:#c62828}
    .fu{background:#fff3e0;color:#e65100}
    .bo{background:#f3e5f5;color:#7b1fa2}
    .wa{background:#e8f5e9;color:#2e7d32}
    .cl{background:#eceff1;color:#546e7a}
    .ot{background:#f0eee8;color:#666}

    .shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:98}
    .shade.o{display:block}
    .sheet{
      display:none;position:fixed;bottom:0;left:0;right:0;max-height:88vh;
      background:var(--surface);border-radius:18px 18px 0 0;z-index:99;
      padding:20px 20px calc(20px + var(--safe-bottom));overflow-y:auto;
      box-shadow:0 -4px 24px rgba(0,0,0,.12);animation:up .25s ease
    }
    @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet.o{display:block}
    .sh{font-size:17px;font-weight:600;margin-bottom:2px;padding-right:30px}
    .ss{font-size:12px;color:var(--muted);margin-bottom:10px}
    .sx{margin-bottom:10px}
    .sl{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:3px;letter-spacing:.3px}
    .x{position:absolute;top:12px;right:14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:var(--bg);border-radius:50%;font-size:15px;cursor:pointer}
    .pk{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;touch-action:manipulation}
    .pk:active{opacity:.85}
    .ok{display:none;text-align:center;font-size:13px;color:#2e7d32;margin-top:8px;padding:8px;background:#e8f5e9;border-radius:8px}
    .ok.o{display:block}
    .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<h1>Pick a Template</h1>
<div class="sub">34 designs · tap any to see details</div>

<div class="bar" id="bar">
  <button class="on" data-g="all">All</button>
  <button data-g="pr">Pro</button>
  <button data-g="ed">Edit</button>
  <button data-g="fu">Fun</button>
  <button data-g="bo">Bold</button>
  <button data-g="wa">Warm</button>
  <button data-g="cl">Clean</button>
  <input class="srch" id="q" placeholder="Search" type="search">
  <span class="cnt" id="c"></span>
</div>

<div class="l" id="l"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>

var B = document.getElementById('bar');
var L = document.getElementById('l');
var C = document.getElementById('c');
var Q = document.getElementById('q');
var SH = document.getElementById('shade');
var ST = document.getElementById('sheet');

function mg(m) {
  var a = (m||[]).join(' ').toLowerCase();
  if(/professional|corporate|business|finance|formal|institutional/.test(a)) return 'pr';
  if(/editorial|literary|atmospheric|narrative|cultural|poster/.test(a)) return 'ed';
  if(/playful|fun|energetic|geeky|retro|neon|rebellious|pop|fresh/.test(a)) return 'fu';
  if(/bold|confident|graphic|punchy|dramatic|powerful/.test(a)) return 'bo';
  if(/warm|friendly|cozy|soft|gentle|organic|inviting|earthy/.test(a)) return 'wa';
  if(/minimal|clean|simple|restrained|quiet|elegant|refined/.test(a)) return 'cl';
  return 'ot';
}

function gf() {
  var act = B.querySelector('[data-g].on');
  var f = act ? act.getAttribute('data-g') : 'all';
  return f;
}

function render() {
  var f = gf();
  var q = Q.value.toLowerCase();
  var items = D.filter(function(t) {
    if (f !== 'all' && mg(t.mood||[]) !== f) return false;
    if (q) {
      if ((t.name||'').toLowerCase().indexOf(q)<0 && (t.tagline||'').toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  C.textContent = items.length;
  if (items.length === 0) {
    L.innerHTML = '<div class="empty">No templates match your filter</div>';
    return;
  }
  L.innerHTML = items.map(function(t) {
    var m = mg(t.mood||[]);
    return '<div class="c" onclick="openSheet(''+t.slug+'')">'
      + '<div class="c-r1"><span class="c-n">'+t.name+'</span><span class="c-b">'+t.slide_count+' slides</span></div>'
      + '<div class="c-t">'+(t.tagline||'').substring(0,100)+'</div>'
      + '<div class="c-tags">'
      + '<span class="'+m+'">'+t.formality+'</span>'
      + '<span>'+(t.scheme||'light')+'</span>'
      + '<span>'+(t.best_for||'').substring(0,30)+'</span>'
      + '</div></div>';
  }).join('');
}

function openSheet(slug) {
  var t = D.find(function(x){return x.slug===slug});
  if (!t) return;
  var m = mg(t.mood||[]);
  var moods = (t.mood||[]).map(function(m){return '<span class="'+mg([m])+'">'+m+'</span>'}).join('');
  var occs = (t.occasion||[]).map(function(o){return '<span>'+o+'</span>'}).join(' ');
  var best = (t.best_for||'N/A').substring(0,350);
  var avoid = t.avoid_for ? (t.avoid_for||'').substring(0,200) : '';
  SH.classList.add('o');
  ST.innerHTML = '<button class="x" onclick="closeSheet()">\u2715</button>'
    + '<div class="sh">'+t.name+'</div>'
    + '<div class="ss">'+(t.tagline||'')+'</div>'
    + (moods ? '<div class="sx"><div class="sl">Style</div><div style="display:flex;gap:4px;flex-wrap:wrap">'+moods+'</div></div>' : '')
    + '<div class="sx"><div class="sl">Best for</div><div style="font-size:13px;line-height:1.45">'+best+'</div></div>'
    + (avoid ? '<div class="sx"><div class="sl">Avoid</div><div style="font-size:12px;color:var(--muted)">'+avoid+'</div></div>' : '')
    + (occs ? '<div class="sx"><div class="sl">Occasions</div><div style="display:flex;gap:4px;flex-wrap:wrap;font-size:12px">'+occs+'</div></div>' : '')
    + '<button class="pk" onclick="pick(''+t.slug+'',''+t.name+'')">Pick This Template</button>'
    + '<div class="ok" id="ok">Copied! Now paste in chat: <b>use '+t.slug+'</b></div>';
  ST.classList.add('o');
}

function closeSheet() {
  ST.classList.remove('o');
  SH.classList.remove('o');
}

function pick(slug, name) {
  var txt = 'Use the '+slug+' template';
  try { navigator.clipboard.writeText(txt); } catch(e) {}
  document.getElementById('ok').classList.add('o');
}

B.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-g]');
  if (!btn) return;
  B.querySelectorAll('[data-g]').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  render();
});

Q.addEventListener('input', render);
SH.addEventListener('click', closeSheet);
render();
</script>
